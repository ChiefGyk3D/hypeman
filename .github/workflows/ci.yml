# Lint (ruff), type check (mypy), tests on Python 3.9-3.13 with a coverage
# floor, the bare-install contract and a workflow lint. The jobs live in
# ChiefGyk3D/git-your-ship-together; its `CI green` job is the one check branch
# protection watches (`ci / CI green`). This file only says what is specific
# to hypeman-social.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@faba0b7d1ab65e9033bef1acfa93d6d57b5808c0 # v1.21.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC and Codecov; python-ci keeps it off the test job
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13"]'
      coverage-python-version: "3.13"
      # Every declared extra is installed so a typo'd or renamed distribution
      # in pyproject.toml fails here, not in a consuming daemon's CI.
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[all,aws,vault,doppler,dev]"
      test-command: pytest --cov=hypeman_social --cov-report=term-missing --cov-report=xml
      coverage-threshold: "65"
      lint-command: ruff check hypeman_social tests
      typecheck-install-command: pip install -e ".[all,aws,vault,doppler,dev]"
      typecheck-command: mypy hypeman_social
      # The library promises to work with only its core dependencies. Install
      # with zero extras, prove every subpackage imports and the platforms
      # fail closed instead of raising.
      smoke-install-command: pip install . pytest
      smoke-command: |
        python -c "import hypeman_social"
        python -c "import hypeman_social.config"
        python -c "import hypeman_social.social"
        python -c "import hypeman_social.llm"
        python -c "import hypeman_social.observability"
        pytest tests/test_optional_extras.py -v
      # A library: there is no image.
      docker-build: false
      egress-policy: block
      # No Doppler: nothing in CI reads a secret.
