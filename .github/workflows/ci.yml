# CI for hypeman. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
      id-token: write   # Doppler OIDC (see the shared repository's README)
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13"]'
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      # Every declared extra is installed so a typo'd or renamed distribution
      # in pyproject.toml fails here, not in a consuming daemon's CI.
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[all,aws,vault,doppler,dev]"
      test-command: pytest --cov=hypeman_social --cov-report=term-missing --cov-report=xml --cov-fail-under=65
      lint-install-command: pip install ruff
      lint-command: ruff check hypeman_social tests
      typecheck-install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[all,aws,vault,doppler,dev]"
      typecheck-command: mypy hypeman_social
      # The library promises to work with only its core dependencies installed:
      # install with zero extras, import every subpackage, run the contract tests.
      smoke-command: |
        python -c "import hypeman_social"
        python -c "import hypeman_social.config"
        python -c "import hypeman_social.social"
        python -c "import hypeman_social.llm"
        python -c "import hypeman_social.observability"
        pip install pytest
        pytest tests/test_optional_extras.py -v
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
