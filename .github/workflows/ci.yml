name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check hypeman_social tests

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,aws,vault,doppler,dev]"

      - name: Run mypy
        run: mypy hypeman_social

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # Every declared extra is installed so a typo'd or renamed distribution
      # in pyproject.toml fails here, not in a consuming daemon's CI.
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,aws,vault,doppler,dev]"

      - name: Run test suite with coverage
        run: pytest --cov=hypeman_social --cov-report=term-missing --cov-fail-under=65

  bare-install:
    name: Bare install (no extras)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # The library promises to work with only its core dependencies installed.
      # Install with zero extras and prove every subpackage imports and the
      # platforms fail closed instead of raising.
      - name: Install package without extras
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Import every subpackage
        run: |
          python -c "import hypeman_social"
          python -c "import hypeman_social.config"
          python -c "import hypeman_social.social"
          python -c "import hypeman_social.llm"
          python -c "import hypeman_social.observability"

      - name: Run the optional-extras contract tests
        run: pytest tests/test_optional_extras.py -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, bare-install]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          pip install dist/*.whl
          python -c "import hypeman_social; print(hypeman_social.__version__)"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
