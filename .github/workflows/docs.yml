name: Docs

# Build on every pull request (a broken link fails the review) and publish to
# GitHub Pages from main. The build/deploy mechanics live in the shared
# workflow; the docs toolchain installs from the hash-checked
# requirements/docs.txt (pip-compile --generate-hashes from the `docs` extra).

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements/docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements/docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/docs-pages.yml@0fc2df49cf51608a2f8b4b8eeb51d86d4d4cfaba # v1.27.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      python-version: '3.13'
      install-command: pip install --disable-pip-version-check --require-hashes -r requirements/docs.txt
      build-command: mkdocs build --strict
