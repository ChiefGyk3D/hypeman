# CodeQL (Python and the workflows themselves), gitleaks, Semgrep, dependency
# review on pull requests, and OpenSSF Scorecard on main. The jobs live in
# ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories and queries reach unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # Scorecard publishing
    with:
      codeql-queries: security-and-quality
      scorecard: true
      # The core dependencies are floors in pyproject.toml, not a pinned
      # requirements file, so pip-audit has nothing to read; dependency review
      # covers what a pull request adds.
      pip-audit-requirements: ""
      egress-policy: block
      # Snyk reads SNYK_TOKEN from the Doppler config over OIDC (no stored secret).
      snyk: true
      # No lock: Snyk Open Source scans a freeze of this install (GYST v1.9.0).
      snyk-install-command: pip install ".[all,aws,vault,doppler]"
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
