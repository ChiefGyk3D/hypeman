# Keeps the pinned GitHub Actions SHAs and Python dependency floors current.
# Actions are pinned by commit SHA (supply-chain hygiene), so without this
# they would silently age forever.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A release that turns out to be malicious is usually pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # A release that turns out to be malicious is usually pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The hash-pinned lock the docs workflow installs from
  # (requirements/docs.txt, from the `docs` extra via pip-compile --generate-hashes).
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
