[build-system]
# setuptools >= 77 for PEP 639 license expressions (License-Expression
# metadata that dependency scanners can actually parse).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypeman-social"
version = "0.2.0"
description = "Shared core for announcement daemons: social publishing, LLM message generation, and health reporting"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ChiefGyk3D" }]
keywords = ["social", "bluesky", "mastodon", "discord", "matrix", "ollama", "announcements"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]

# Deliberately minimal. Every social network and LLM backend is an optional
# extra, so a daemon that only posts to Mastodon doesn't drag in the AWS SDK.
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# beautifulsoup4 backs the Open Graph scrape for embed cards on links the
# platform APIs don't describe; without it those posts go out without a card.
bluesky   = ["atproto>=0.0.55", "grapheme>=0.6.0", "beautifulsoup4>=4.12.0"]
mastodon  = ["Mastodon.py>=1.8.1"]
ollama    = ["ollama>=0.3.0"]
gemini    = ["google-genai>=0.3.0"]
aws       = ["boto3>=1.34.0"]
vault     = ["hvac>=2.1.0"]
doppler   = ["doppler-sdk>=1.3.0"]

# Everything a daemon typically needs: all four networks and both LLM providers.
all = [
    "atproto>=0.0.55",
    "grapheme>=0.6.0",
    "beautifulsoup4>=4.12.0",
    "Mastodon.py>=1.8.1",
    "ollama>=0.3.0",
    "google-genai>=0.3.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyflakes>=3.2.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

# Building the documentation site (mkdocs serve / mkdocs build).
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/hypeman"
Issues = "https://github.com/ChiefGyk3D/hypeman/issues"

[tool.setuptools.packages.find]
include = ["hypeman_social*"]

[tool.setuptools.package-data]
# PEP 561: ships the py.typed marker so mypy/pyright type-check against the
# library's own annotations in downstream projects.
hypeman_social = ["py.typed"]

[tool.mypy]
# Gradual typing: annotated functions are checked strictly, unannotated ones
# are left alone until they grow annotations. Every third-party SDK here
# (atproto, Mastodon.py, ollama, ...) ships without stubs, so missing-import
# errors are noise rather than signal.
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly so CI results don't shift when ruff's defaults change.
# E/F catch real mistakes, I keeps imports ordered, PIE/PLW catch a few
# footguns. The broad-except patterns in this codebase are deliberate
# (a platform having a bad day must not take down the daemon), so BLE is out.
select = ["E4", "E7", "E9", "F", "I", "PIE", "PLW"]
# Module-level caches guarded by `global` are deliberate in config/secrets.
ignore = ["PLW0603"]
